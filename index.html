<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="브라우저에서 바로 쓰고 미리보는 개인 블로그 에디터">
    <title>write. - 블로그 에디터</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <a class="brand" href="/" aria-label="write. 홈">write<span>.</span></a>
        <div class="header-actions">
          <button class="text-button" id="posts-button" type="button">저장한 글</button>
          <span class="save-status" id="save-status" role="status">이 브라우저에 저장됩니다</span>
          <button class="publish-button" id="publish-button" type="button">글 저장</button>
        </div>
      </header>

      <main class="editor-shell">
        <aside class="format-rail" aria-label="서식 도구">
          <button data-format="heading" type="button" aria-label="제목 넣기">H</button>
          <button data-format="bold" type="button" aria-label="굵게">B</button>
          <button data-format="italic" type="button" aria-label="기울임">I</button>
          <button data-format="quote" type="button" aria-label="인용문 넣기">Q</button>
          <button data-format="code" type="button" aria-label="코드 블록 넣기">&lt;/&gt;</button>
          <button data-format="list" type="button" aria-label="목록 넣기">L</button>
        </aside>

        <section class="draft-pane" aria-labelledby="draft-heading">
          <div class="pane-label" id="draft-heading">초안</div>
          <label class="sr-only" for="post-title">글 제목</label>
          <input id="post-title" class="title-input" maxlength="100" placeholder="제목을 입력하세요" autocomplete="off" aria-describedby="editor-help">
          <label class="sr-only" for="post-content">글 내용</label>
          <textarea id="post-content" class="content-input" aria-describedby="editor-help" placeholder="떠오른 생각을 적어보세요.&#10;&#10;마크다운 형식을 사용할 수 있어요.&#10;# 큰 제목&#10;**굵은 글씨**&#10;- 목록"></textarea>
          <p class="sr-only" id="editor-help">제목과 내용을 입력하면 오른쪽 미리보기에 바로 반영됩니다. 서식 도구로 제목, 굵게, 기울임, 인용문, 코드 블록, 목록을 넣을 수 있습니다.</p>
          <footer class="draft-footer">
            <span id="word-count">0자</span>
            <span>자동 임시저장</span>
          </footer>
        </section>

        <section class="preview-pane" aria-labelledby="preview-heading">
          <div class="pane-label" id="preview-heading">미리보기</div>
          <article class="preview-content" id="preview-content">
            <p class="empty-preview">초안을 시작하면 이곳에서 글의 모양을 바로 확인할 수 있습니다.</p>
          </article>
        </section>
      </main>
    </div>

    <dialog class="posts-dialog" id="posts-dialog" aria-labelledby="posts-title">
      <div class="dialog-header">
        <div>
          <p class="dialog-kicker">이 브라우저에 저장됨</p>
          <h2 id="posts-title">저장한 글</h2>
        </div>
        <button class="close-button" id="close-dialog" type="button" aria-label="글 목록 닫기">닫기</button>
      </div>
      <div class="post-list" id="post-list"></div>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="app.js"></script>
  </body>
</html>
